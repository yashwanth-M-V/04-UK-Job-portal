name: Daily Job Pipeline Update

on:
  schedule:
    - cron: "0 21 * * *"   # Runs daily at 21:00 UTC
  workflow_dispatch:        # Allows manual trigger

permissions:
  contents: write           # Required to push changes

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true   # <-- important for Git LFS

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          uv sync

      - name: Run data pipeline
        run: |
          uv run python main.py

      - name: Set up Git LFS
        run: |
          git lfs install
          git lfs track "data/jobs_silver.csv" || echo "Already tracked"

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add .
          git diff --cached --quiet || git commit -m "chore: daily job postings update"
          git push