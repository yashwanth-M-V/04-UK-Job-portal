name: Daily Job Pipeline Update

on:
  schedule:
    - cron: "0 20 * * *"   # Runs daily at 20:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2️⃣ Install UV
      - name: Install uv
        uses: astral-sh/setup-uv@v4

      # 3️⃣ Set up Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 4️⃣ Install dependencies
      - name: Install dependencies
        run: uv sync

      # 5️⃣ Debug secrets (optional, remove in prod)
      - name: Debug secrets
        run: |
          echo "API_URL: ${API_URL}"
          echo "SUPABASE_URL: ${SUPABASE_URL}"
          echo "SUPABASE_KEY: ${SUPABASE_KEY}"
          echo "SUPABASE_BUCKET_NAME: ${SUPABASE_BUCKET_NAME}"
          echo "CONNECTION_STRING: ${CONNECTION_STRING}"
          echo "SUPABASE_SERVICE_KEY: ${SUPABASE_SERVICE_KEY}"
          echo "SEND_GRID_API_KEY: ${SEND_GRID_API_KEY}"
          echo "FROM_EMAIL: ${FROM_EMAIL}"
          echo "BOT_TOKEN: ${BOT_TOKEN}"
          echo "BOT_USERNAME: ${BOT_USERNAME}"
        env:
          API_URL: ${{ secrets.API_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          SUPABASE_BUCKET_NAME: ${{ secrets.SUPABASE_BUCKET_NAME }}
          CONNECTION_STRING: ${{ secrets.CONNECTION_STRING }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SEND_GRID_API_KEY: ${{ secrets.SEND_GRID_API_KEY }}
          FROM_EMAIL: ${{ secrets.FROM_EMAIL }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          BOT_USERNAME: ${{ secrets.BOT_USERNAME }}

      # 6️⃣ Run data pipeline
      - name: Run data pipeline
        env:
          API_URL: ${{ secrets.API_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          SUPABASE_BUCKET_NAME: ${{ secrets.SUPABASE_BUCKET_NAME }}
          CONNECTION_STRING: ${{ secrets.CONNECTION_STRING }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SEND_GRID_API_KEY: ${{ secrets.SEND_GRID_API_KEY }}
          FROM_EMAIL: ${{ secrets.FROM_EMAIL }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          BOT_USERNAME: ${{ secrets.BOT_USERNAME }}
        run: uv run python main.py

      # 6b. Send notifications
      - name: Send job notifications
        env:
          API_URL: ${{ secrets.API_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          CONNECTION_STRING: ${{ secrets.CONNECTION_STRING }}
          SEND_GRID_API_KEY: ${{ secrets.SEND_GRID_API_KEY }}
          FROM_EMAIL: ${{ secrets.FROM_EMAIL }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        run: uv run python notify.py

      # 7️⃣ Commit updated website
      - name: Commit updated website
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add index.html
          git diff --cached --quiet || git commit -m "daily job update"
          git push
