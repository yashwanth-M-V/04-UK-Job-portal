name: Daily Job Pipeline Update

on:
  schedule:
    - cron: "0 21 * * *"   # Runs daily at 21:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2️⃣ Install UV
      - name: Install uv
        uses: astral-sh/setup-uv@v4

      # 3️⃣ Set up Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 4️⃣ Install dependencies
      - name: Install dependencies
        run: uv sync

      # 5️⃣ Debug secrets (optional, remove in prod)
      - name: Debug environment
        run: |
          echo "API_URL present: ${SUPABASE_URL:+yes}"
          echo "SUPABASE_KEY present: ${SUPABASE_KEY:+yes}"
          echo "BUCKET_NAME present: ${BUCKET_NAME:+yes}"
          echo "DATABASE_URL present: ${DATABASE_URL:+yes}"
        env:
          SUPABASE_URL: ${{ secrets.API_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BUCKET_NAME: ${{ secrets.BUCKET_NAME }}

      # 6️⃣ Run data pipeline
      - name: Run data pipeline
        env:
          SUPABASE_URL: ${{ secrets.API_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BUCKET_NAME: ${{ secrets.BUCKET_NAME }}
        run: uv run python main.py

      # 7️⃣ Commit updated website
      - name: Commit updated website
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add index.html
          git diff --cached --quiet || git commit -m "daily job update"
          git push